services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"          # expose on 5433 to avoid conflict with local Postgres
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Blazor / ASP.NET Core app ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Database=clinic_scheduler;Username=postgres;Password=devpassword
      ApiBaseUrl: "http://localhost:8080/"
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is ready before starting

volumes:
  clinic_db_data:
