services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"          # expose for local tools (pgAdmin, DBeaver, etc.)
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Blazor / ASP.NET Core app ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: >-
        Host=db;Database=clinic_scheduler;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-admin1234}
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is ready before starting

volumes:
  clinic_db_data:
